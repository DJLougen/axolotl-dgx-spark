# BASELINE: stock Axolotl QLoRA, no fused kernels (mirrors a typical config).
# Differences vs optimized are ONLY the kernel flags, so the comparison is clean.
base_model: Qwen/Qwen3-0.6B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: false
load_in_4bit: true
adapter: qlora
strict: false
chat_template: qwen3

datasets:
  - path: data/bench_chat.jsonl
    type: chat_template
    field_messages: messages
dataset_prepared_path: data/prepared_vanilla
output_dir: outputs/vanilla
val_set_size: 0

sequence_len: 1024
sample_packing: false
pad_to_sequence_len: true

micro_batch_size: 8
gradient_accumulation_steps: 1
num_epochs: 1
max_steps: 30
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002
warmup_steps: 5
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: false        # 0.6B fits easily; isolate kernel speed (no recompute)

# attention: flash-attn2 has no aarch64/Blackwell wheel; SDPA (cuDNN) is the practical backend
flash_attention: false
sdp_attention: true

# LoRA (identical across all runs). dropout 0 so the fast-kernel path is eligible in the optimized run.
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_linear: true

# NO fused kernels in baseline.

logging_steps: 1
save_strategy: "no"
special_tokens:
seed: 1234
