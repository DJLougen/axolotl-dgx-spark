# OPTIMIZED Qwen3-1.7B QLoRA (the user's real SelfTrace model size) with fused kernels.
base_model: Qwen/Qwen3-1.7B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: false
load_in_4bit: true
adapter: qlora
strict: false
chat_template: qwen3

datasets:
  - path: data/bench_chat.jsonl
    type: chat_template
    field_messages: messages
dataset_prepared_path: data/prepared_17b
output_dir: outputs/opt17b
val_set_size: 0

sequence_len: 1024
sample_packing: false
pad_to_sequence_len: true

micro_batch_size: 4
gradient_accumulation_steps: 1
num_epochs: 1
max_steps: 20
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002
warmup_steps: 3
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: false

flash_attention: true   # kernels-community/flash-attn2 on GB10; ~1.4x faster than SDPA in real training

lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_linear: true

plugins:
  - axolotl.integrations.liger.LigerPlugin
liger_rope: true
liger_rms_norm: true
liger_layer_norm: false
liger_glu_activation: false
liger_fused_linear_cross_entropy: true
lora_mlp_kernel: true
lora_qkv_kernel: true
lora_o_kernel: true

logging_steps: 1
save_strategy: "no"
special_tokens:
seed: 1234
